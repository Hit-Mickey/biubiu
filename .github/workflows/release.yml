name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "已有的发布标签（如 v2.1.0）。留空时使用所选分支或标签"
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  select:
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      tag: ${{ steps.source.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: source
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          tag="$REQUESTED_TAG"
          if [[ -z "$tag" && "$GITHUB_REF_TYPE" == tag ]]; then tag="$GITHUB_REF_NAME"; fi
          sha=$(git rev-parse "$GITHUB_SHA^{commit}")
          if [[ -n "$tag" ]]; then
            if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "::error::Expected a version tag such as v2.1.0."
              exit 1
            fi
            sha=$(git rev-parse --verify "refs/tags/$tag^{commit}")
            if [[ "$GITHUB_REF_TYPE" == tag ]]; then
              test "$tag" = "$GITHUB_REF_NAME"
              test "$sha" = "$(git rev-parse "$GITHUB_SHA^{commit}")"
            fi
          fi
          version=$(git show "$sha:package.json" | jq -er '.version | strings')
          native_version=$(git show "$sha:src-tauri/Cargo.toml" | python3 -c 'import sys,tomllib; print(tomllib.load(sys.stdin.buffer)["package"]["version"])')
          lock_version=$(git show "$sha:src-tauri/Cargo.lock" | python3 -c 'import sys,tomllib; print(next(p["version"] for p in tomllib.load(sys.stdin.buffer)["package"] if p["name"] == "biubiu"))')
          config_version=$(git show "$sha:src-tauri/tauri.conf.json" | jq -er '.version | strings')
          if [[ "$version" != "$native_version" || "$version" != "$lock_version" || "$version" != "$config_version" ]]; then
            echo "::error::Version mismatch: package.json=$version, Cargo.toml=$native_version, Cargo.lock=$lock_version, tauri.conf.json=$config_version"
            exit 1
          fi
          if [[ -n "$tag" && "$tag" != "v$version" ]]; then
            echo "::error::Tag $tag must match application version v$version."
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  build:
    needs: select
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: windows-latest, target: x86_64-pc-windows-msvc }
          - { runner: windows-11-arm, target: aarch64-pc-windows-msvc }
          - { runner: macos-15-intel, target: x86_64-apple-darwin }
          - { runner: macos-15, target: aarch64-apple-darwin }
          - { runner: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { runner: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu }
    env:
      HUSKY: 0
      MACOSX_DEPLOYMENT_TARGET: "12.0"
      CARGO_INCREMENTAL: 0
      APPIMAGE_EXTRACT_AND_RUN: 1
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.select.outputs.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: false
      - name: Linux build libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config file libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev libasound2-dev libdbus-1-dev \
            libssl-dev libgnutls28-dev patchelf rpm xdg-utils
      - uses: msys2/setup-msys2@v2
        if: matrix.runner == 'windows-11-arm'
        with:
          msystem: CLANGARM64
          update: true
          install: make diffutils tar xz curl mingw-w64-clang-aarch64-clang
      - name: Build native Windows ARM64 FFmpeg
        if: matrix.runner == 'windows-11-arm'
        shell: msys2 {0}
        env:
          CC: clang
          FFMPEG_ARCH: aarch64
        run: bash scripts/build-ffmpeg.sh
      - run: pnpm install --frozen-lockfile
      - name: Check frontend
        if: matrix.runner == 'windows-latest'
        run: |
          pnpm exec tsc --noEmit
          pnpm exec vitest run
      - run: pnpm build --target ${{ matrix.target }}
      - id: collect
        run: node scripts/collect-release.mjs ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: BiuBiu-${{ matrix.target }}
          path: ${{ steps.collect.outputs.files }}
          overwrite: true
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  android:
    name: Build Android APK
    needs: select
    runs-on: ubuntu-24.04
    steps:
      - id: signing
        name: Prepare Android signing
        env:
          TAG: ${{ needs.select.outputs.tag }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=()
          for secret in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!secret:-}" ]]; then missing+=("$secret"); fi
          done
          if (( ${#missing[@]} )); then
            if [[ -n "$TAG" ]]; then
              echo "::error::Android release signing requires these repository secrets: ${missing[*]}"
              exit 1
            fi
            echo "::notice::Building a debug APK. Missing Android signing secrets: ${missing[*]}"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            umask 077
            keystore="$RUNNER_TEMP/biubiu.jks"
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
            test -s "$keystore"
            echo "BIUBIU_ANDROID_KEYSTORE=$keystore" >> "$GITHUB_ENV"
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.select.outputs.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: "15859902"
          packages: ""
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Android toolchain
        run: |
          set -euo pipefail
          sdkmanager --version
          chmod +x src-tauri/gen/android/gradlew
          sdkmanager --sdk_root="$ANDROID_HOME" 'platform-tools' 'platforms;android-37.0' \
            'build-tools;36.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'
          ndk="$ANDROID_HOME/ndk/27.2.12479018"
          {
            echo "NDK_HOME=$ndk"
            echo "ANDROID_NDK_HOME=$ndk"
          } >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmake/3.22.1/bin" >> "$GITHUB_PATH"
      - run: pnpm install --frozen-lockfile
      - name: Build universal APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          SIGNED: ${{ steps.signing.outputs.ready }}
        run: |
          set -euo pipefail
          mode=release
          args=()
          if [[ "$SIGNED" != true ]]; then mode=debug; args+=(--debug); fi
          pnpm build:android --ci "${args[@]}"
          apk="src-tauri/gen/android/app/build/outputs/apk/universal/$mode/app-universal-$mode.apk"
          build_tools="$ANDROID_HOME/build-tools/36.0.0"
          "$build_tools/apksigner" verify "$apk"
          if [[ "$SIGNED" == true ]]; then "$build_tools/zipalign" -c -P 16 4 "$apk"; fi
          version=$(node -p "require('./package.json').version")
          "$build_tools/aapt2" dump badging "$apk" > "$RUNNER_TEMP/biubiu-apk-badging"
          grep -F "versionName='$version'" "$RUNNER_TEMP/biubiu-apk-badging"
          unzip -Z1 "$apk" > "$RUNNER_TEMP/biubiu-apk-files"
          for abi in arm64-v8a x86_64; do
            grep -Fx "lib/$abi/libbiubiu_lib.so" "$RUNNER_TEMP/biubiu-apk-files"
            grep -Fx "lib/$abi/libbiubiu_ffmpeg.so" "$RUNNER_TEMP/biubiu-apk-files"
          done
          mkdir -p dist/android
          cp "$apk" "dist/android/BiuBiu_${version}_android.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.signing.outputs.ready == 'true' && 'BiuBiu-android' || 'Android-test' }}
          path: dist/android/*.apk
          overwrite: true
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    needs: [select, build, android]
    if: needs.select.outputs.tag != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.select.outputs.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: BiuBiu-*
          path: assets
          merge-multiple: true
      - name: Verify release files
        run: node scripts/collect-release.mjs --verify assets --android
      - name: Publish verified tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.select.outputs.tag }}
          SHA: ${{ needs.select.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "+refs/tags/$TAG:refs/tags/$TAG"
          test "$(git rev-parse "refs/tags/$TAG^{commit}")" = "$SHA"
          if gh release view "$TAG" --json isDraft,assets > "$RUNNER_TEMP/release.json"; then
            jq -e '.isDraft' "$RUNNER_TEMP/release.json"
            for arch in x64 arm64; do
              legacy_msi="BiuBiu_${TAG#v}_${arch}.msi"
              if jq -e --arg file "$legacy_msi" 'any(.assets[]; .name == $file)' "$RUNNER_TEMP/release.json" > /dev/null; then
                gh release delete-asset "$TAG" "$legacy_msi" --yes
              fi
            done
          else
            gh release create "$TAG" --verify-tag --draft --title "BiuBiu $TAG" --generate-notes
          fi
          gh release upload "$TAG" assets/* --clobber
          if [[ "$TAG" == *-* ]]; then
            gh release edit "$TAG" --prerelease --draft=false --latest=false
          else
            gh release edit "$TAG" --draft=false --prerelease=false --latest
          fi
