name: PR Test Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Core Changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      core: ${{ steps.filter.outputs.core }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Paths Filter
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            core:
              - 'src/**'
              - 'electron/**'
              - 'shared/**'
              - 'plugins/**'
              - 'rsbuild.config.ts'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - '.nvmrc'
              - 'tsconfig.json'
              - '.github/workflows/pr-test-build.yml'

  build:
    name: Build on ${{ matrix.os }}
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.core == 'true') }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, windows-latest, ubuntu-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Configure Git to use HTTPS instead of SSH
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          HUSKY: 0

      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends rpm

      - name: Build
        run: pnpm build
        env:
          BIUBIU_BUILD_ONLY: "1"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BiuBiu-${{ matrix.os }}
          path: |
            dist/artifacts/*.exe
            dist/artifacts/*.blockmap
            dist/artifacts/*.yml
            dist/artifacts/*.dmg
            dist/artifacts/*.zip
            dist/artifacts/*.AppImage
            dist/artifacts/*.deb
            dist/artifacts/*.rpm
          if-no-files-found: error
          retention-days: 5

  no-build:
    name: No Build (docs or non-core)
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ github.event_name == 'pull_request' && needs.changes.outputs.core != 'true' }}
    steps:
      - run: echo "No core code changes detected; skipping build."
  build-gate:
    name: Build Gate
    runs-on: ubuntu-latest
    needs: [build, no-build]
    if: always() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    steps:
      - run: echo "all builds succeeded"
